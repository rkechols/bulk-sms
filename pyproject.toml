[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "bulk-sms"
version = "0.1.0"
description = "Send the same SMS message to multiple recipient groups"
readme = "README.md"
authors = [
    { name = "Ryan Echols", email = "rkechols21@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3,<4",
    "httpx2>=2.12.0,<3",
    "python-dotenv>=1.2.3,<2",
]

[project.scripts]
sms-server = "bulk_sms.main_server:main"
sms-send = "bulk_sms.main_send:main"

[dependency-groups]
dev = [
    "basedpyright>=1.40.0,<2",
    "ruff~=0.16.6",
]

[tool.ruff]
# This section ensures that ruff finds the python version declared in this file
extend = "ruff.toml"

[tool.basedpyright]
pythonPlatform = "All"
typeCheckingMode = "recommended"
# Rule adjustments:
reportAny = "hint"
reportExplicitAny = false
reportMissingParameterType = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnusedCallResult = false
# Bad libs:
# allowedUntypedLibraries = []
