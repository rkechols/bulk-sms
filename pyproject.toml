[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[project]
name = "bulk-sms"
version = "0.1.0"
description = "Send the same SMS message to multiple recipient groups"
readme = "README.md"
authors = [
    { name = "Ryan Echols", email = "rkechols21@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi~=0.141.1",
    "httpx2>=2.12.0,<3",
    "pydantic>=2.13.5,<3",
    "uvicorn[standard]~=0.52.4",
]
